[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-lang"
version = "1.0.0"
description = "Warden: a small, secure-by-default, PHP-like language for web back ends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dr. Abdul Shareef Pallivalappil" }]
dependencies = []

[project.optional-dependencies]
bcrypt = ["bcrypt>=4.0"]       # verify password hashes migrated from PHP
prod = ["gunicorn>=21.2"]

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools]
packages = ["warden"]
include-package-data = true

[tool.setuptools.package-data]
warden = ["skeleton/**/*", "skeleton/*"]
